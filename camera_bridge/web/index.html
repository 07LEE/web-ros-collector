<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WROS Camera Bridge</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="container">
        <h1>WROS Camera Stream</h1>
        <video id="video" autoplay playsinline></video>
        <button id="startBtn" class="btn">스트리밍 시작</button>
        <div id="status">대기 중</div>
    </div>

    <script>
        const video = document.getElementById('video');
        const startBtn = document.getElementById('startBtn');
        const statusDiv = document.getElementById('status');

        const canvas = document.createElement('canvas');
        const context = canvas.getContext('2d');

        let mediaStream = null;
        let streaming = false;
        let isUploading = false;
        let animationFrameId = null;

        function parseFastDeviceInfo() {
            let model = "Unknown Device";
            let os = "Unknown OS";
            let browser = "Unknown Browser";

            const ua = navigator.userAgent;

            if (/iPhone/i.test(ua)) {
                model = "Apple iPhone";
                os = "iOS";
            } else if (/iPad/i.test(ua)) {
                model = "Apple iPad";
                os = "iOS";
            } else if (/Android/i.test(ua)) {
                const match = ua.match(/Android\s+[\d\.]+;\s*([^;\)]+)/i);
                if (match && match[1]) {
                    model = match[1].trim();
                } else {
                    model = "Android Device";
                }
                os = "Android";
            } else if (/Macintosh/i.test(ua)) {
                model = "Mac Device";
                os = "macOS";
            } else if (/Windows/i.test(ua)) {
                model = "Windows PC";
                os = "Windows";
            } else if (/Linux/i.test(ua)) {
                model = "Linux PC";
                os = "Linux";
            }

            if (/Chrome/i.test(ua) && !/Edg/i.test(ua)) browser = "Chrome";
            else if (/Safari/i.test(ua) && !/Chrome/i.test(ua)) browser = "Safari";
            else if (/Firefox/i.test(ua)) browser = "Firefox";
            else if (/Edg/i.test(ua)) browser = "Edge";

            return { model, os, browser, rawUserAgent: ua };
        }

        async function initCamera() {
            try {
                const deviceInfo = parseFastDeviceInfo();

                const constraints = {
                    video: {
                        facingMode: { ideal: 'environment' },
                        width: { ideal: 3840, max: 4096 },
                        height: { ideal: 2160, max: 2160 },
                        frameRate: { ideal: 60 }
                    },
                    audio: false
                };

                mediaStream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = mediaStream;

                const videoTrack = mediaStream.getVideoTracks()[0];
                if (videoTrack) {
                    const settings = videoTrack.getSettings();
                    deviceInfo.cameraLabel = videoTrack.label || "Default Camera";
                    deviceInfo.width = settings.width;
                    deviceInfo.height = settings.height;
                    deviceInfo.frameRate = settings.frameRate;

                    sendDeviceInfoAsync(deviceInfo);
                }

                statusDiv.innerText = "준비 완료";
            } catch (err) {
                console.error("카메라 접근 오류: ", err);
                statusDiv.innerText = "카메라 접근 실패";
            }
        }

        function sendDeviceInfoAsync(info) {
            fetch('/device_info', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(info)
            }).catch(err => console.warn("디바이스 정보 전송 실패:", err));
        }

        function sendFrameLoop() {
            if (!streaming) return;

            if (!isUploading && video.videoWidth > 0 && video.videoHeight > 0) {
                isUploading = true;

                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                context.drawImage(video, 0, 0, canvas.width, canvas.height);

                canvas.toBlob(async (blob) => {
                    if (!blob) {
                        isUploading = false;
                        return;
                    }
                    try {
                        const arrayBuffer = await blob.arrayBuffer();
                        const response = await fetch('/upload', {
                            method: 'POST',
                            headers: { 'Content-Type': 'image/png' },
                            body: arrayBuffer
                        });

                        if (response.ok) {
                            statusDiv.innerText = "스트리밍 중";
                        } else {
                            statusDiv.innerText = "전송 오류";
                        }
                    } catch (err) {
                        console.error("업로드 오류: ", err);
                        statusDiv.innerText = "서버 연결 끊김";
                    } finally {
                        isUploading = false;
                    }
                }, 'image/png');
            }

            animationFrameId = requestAnimationFrame(sendFrameLoop);
        }

        startBtn.addEventListener('click', () => {
            if (!streaming) {
                streaming = true;
                startBtn.innerText = "스트리밍 중지";
                startBtn.classList.add('btn-stop');
                animationFrameId = requestAnimationFrame(sendFrameLoop);
            } else {
                streaming = false;
                startBtn.innerText = "스트리밍 시작";
                startBtn.classList.remove('btn-stop');
                if (animationFrameId) {
                    cancelAnimationFrame(animationFrameId);
                    animationFrameId = null;
                }
                statusDiv.innerText = "중지됨";
            }
        });

        window.addEventListener('load', initCamera);
    </script>
</body>
</html>
