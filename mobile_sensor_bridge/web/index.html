<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Sensor Bridge</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="container">
        <header>
            <h1>Mobile Sensor Bridge</h1>
            <div id="status">READY</div>
        </header>

        <div class="video-container">
            <video id="video" autoplay playsinline></video>
        </div>

        <div class="controls">
            <div class="select-row">
                <select id="resSelect" class="btn btn-secondary">
                    <option value="720p" selected>720p (1280x720)</option>
                    <option value="1080p">1080p (1920x1080)</option>
                    <option value="4k">4K (3840x2160)</option>
                </select>
                <select id="expSelect" class="btn btn-secondary">
                    <option value="auto">Auto -2EV (locked)</option>
                    <option value="250">1/250s (bright)</option>
                    <option value="120" selected>1/120s (default)</option>
                    <option value="60">1/60s (indoor)</option>
                </select>
            </div>
            <button id="startBtn" class="btn btn-action">START STREAMING</button>
            <button id="imuPermissionBtn" class="btn btn-secondary btn-action">IMU PERMISSION</button>
        </div>

        <!-- Compact Monotone Sensor Data Table -->
        <div class="sensor-section">
            <div class="sensor-title">ROBOT SENSORS & SYSTEM</div>
            <table class="sensor-table">
                <thead>
                    <tr>
                        <th>SENSOR</th>
                        <th>METRIC</th>
                        <th>VALUE</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td class="axis-label">BATTERY</td>
                        <td>LEVEL / CHARGING</td>
                        <td class="val-num" id="batteryVal">-- %</td>
                    </tr>
                    <tr>
                        <td class="axis-label">GPS</td>
                        <td>LAT / LON</td>
                        <td class="val-num" id="gpsCoordVal">-- / --</td>
                    </tr>
                    <tr>
                        <td class="axis-label">GPS ACC</td>
                        <td>ACCURACY (m)</td>
                        <td class="val-num" id="gpsAccVal">-- m</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="sensor-section">
            <div class="sensor-title">IMU REALTIME DATA</div>
            <table class="sensor-table">
                <thead>
                    <tr>
                        <th>AXIS</th>
                        <th>ACCEL (m/s²)</th>
                        <th>GYRO (deg/s)</th>
                        <th>ORI (deg)</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td class="axis-label">X / α</td>
                        <td class="val-num" id="accelX">0.00</td>
                        <td class="val-num" id="gyroA">0.00</td>
                        <td class="val-num" id="oriA">0.00</td>
                    </tr>
                    <tr>
                        <td class="axis-label">Y / β</td>
                        <td class="val-num" id="accelY">0.00</td>
                        <td class="val-num" id="gyroB">0.00</td>
                        <td class="val-num" id="oriB">0.00</td>
                    </tr>
                    <tr>
                        <td class="axis-label">Z / γ</td>
                        <td class="val-num" id="accelZ">0.00</td>
                        <td class="val-num" id="gyroG">0.00</td>
                        <td class="val-num" id="oriG">0.00</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const startBtn = document.getElementById('startBtn');
        const imuPermissionBtn = document.getElementById('imuPermissionBtn');
        const statusDiv = document.getElementById('status');

        const accelXEl = document.getElementById('accelX');
        const accelYEl = document.getElementById('accelY');
        const accelZEl = document.getElementById('accelZ');
        const gyroAEl = document.getElementById('gyroA');
        const gyroBEl = document.getElementById('gyroB');
        const gyroGEl = document.getElementById('gyroG');
        const oriAEl = document.getElementById('oriA');
        const oriBEl = document.getElementById('oriB');
        const oriGEl = document.getElementById('oriG');

        const batteryValEl = document.getElementById('batteryVal');
        const gpsCoordValEl = document.getElementById('gpsCoordVal');
        const gpsAccValEl = document.getElementById('gpsAccVal');

        const canvas = document.createElement('canvas');
        const context = canvas.getContext('2d');

        let mediaStream = null;
        let streaming = false;
        let inFlight = 0;
        const MAX_IN_FLIGHT = 3;
        let isImuUploading = false;
        let animationFrameId = null;
        let imuIntervalId = null;
        let batteryIntervalId = null;
        let gpsIntervalId = null;
        let lockedExposureTime = null;  // in 100us units (W3C spec), set after lockCameraConstraints
        let lockedIso = null;

        const imuData = {
            accel: { x: 0, y: 0, z: 0 },
            gyro: { alpha: 0, beta: 0, gamma: 0 },
            orientation: { alpha: 0, beta: 0, gamma: 0 }
        };

        const batteryData = { level: 1.0, charging: false };
        const gpsData = { latitude: 0.0, longitude: 0.0, altitude: 0.0, accuracy: 0.0 };

        function setupBatterySensor() {
            if (navigator.getBattery) {
                navigator.getBattery().then(battery => {
                    const updateBattery = () => {
                        batteryData.level = battery.level;
                        batteryData.charging = battery.charging;
                        if (batteryValEl) {
                            batteryValEl.innerText = `${Math.round(battery.level * 100)}% ${battery.charging ? '(CHG)' : ''}`;
                        }
                    };
                    updateBattery();
                    battery.addEventListener('levelchange', updateBattery);
                    battery.addEventListener('chargingchange', updateBattery);
                }).catch(err => console.warn("Battery API error:", err));
            }
        }

        function sendBatteryData() {
            if (!streaming) return;
            const clientTsMs = getSyncedTimestampMs();
            fetch('/battery', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Client-Timestamp-Ms': clientTsMs.toString()
                },
                body: JSON.stringify({ ...batteryData, clientTimestampMs: clientTsMs })
            }).catch(err => console.warn("Battery send failed:", err));
        }

        function setupGPSSensor() {
            if ('geolocation' in navigator) {
                navigator.geolocation.watchPosition(
                    (pos) => {
                        gpsData.latitude = pos.coords.latitude;
                        gpsData.longitude = pos.coords.longitude;
                        gpsData.altitude = pos.coords.altitude || 0.0;
                        gpsData.accuracy = pos.coords.accuracy || 0.0;

                        if (gpsCoordValEl) {
                            gpsCoordValEl.innerText = `${pos.coords.latitude.toFixed(4)} / ${pos.coords.longitude.toFixed(4)}`;
                        }
                        if (gpsAccValEl) {
                            gpsAccValEl.innerText = `${pos.coords.accuracy.toFixed(1)} m`;
                        }
                    },
                    (err) => console.warn("GPS Geolocation error:", err),
                    { enableHighAccuracy: true, maximumAge: 1000, timeout: 10000 }
                );
            }
        }

        function sendGPSData() {
            if (!streaming) return;
            const clientTsMs = getSyncedTimestampMs();
            fetch('/gps', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Client-Timestamp-Ms': clientTsMs.toString()
                },
                body: JSON.stringify({ ...gpsData, clientTimestampMs: clientTsMs })
            }).catch(err => console.warn("GPS send failed:", err));
        }

        function parseFastDeviceInfo() {
            let model = "Unknown Device";
            let os = "Unknown OS";
            let browser = "Unknown Browser";

            const ua = navigator.userAgent;

            if (/iPhone/i.test(ua)) {
                model = "Apple iPhone";
                os = "iOS";
            } else if (/iPad/i.test(ua)) {
                model = "Apple iPad";
                os = "iOS";
            } else if (/Android/i.test(ua)) {
                const match = ua.match(/Android\s+[\d\.]+;\s*([^;\)]+)/i);
                model = (match && match[1]) ? match[1].trim() : "Android Device";
                os = "Android";
            } else if (/Macintosh/i.test(ua)) {
                model = "Mac Device";
                os = "macOS";
            } else if (/Windows/i.test(ua)) {
                model = "Windows PC";
                os = "Windows";
            } else if (/Linux/i.test(ua)) {
                model = "Linux PC";
                os = "Linux";
            }

            if (/Chrome/i.test(ua) && !/Edg/i.test(ua)) browser = "Chrome";
            else if (/Safari/i.test(ua) && !/Chrome/i.test(ua)) browser = "Safari";
            else if (/Firefox/i.test(ua)) browser = "Firefox";
            else if (/Edg/i.test(ua)) browser = "Edge";

            return { model, os, browser, rawUserAgent: ua };
        }

        function getSelectedConstraints() {
            const resSelect = document.getElementById('resSelect');
            const val = resSelect ? resSelect.value : '720p';
            let width = 1280, height = 720;
            if (val === '1080p') {
                width = 1920; height = 1080;
            } else if (val === '4k') {
                width = 3840; height = 2160;
            }
            return {
                video: {
                    facingMode: { ideal: 'environment' },
                    width: { ideal: width },
                    height: { ideal: height },
                    frameRate: { ideal: 60 }
                },
                audio: false
            };
        }

        async function initCamera() {
            try {
                const deviceInfo = parseFastDeviceInfo();
                const constraints = getSelectedConstraints();

                if (mediaStream) {
                    mediaStream.getTracks().forEach(t => t.stop());
                }

                mediaStream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = mediaStream;
                try {
                    await video.play();
                } catch (e) {
                    console.warn("video.play initial trigger warning:", e);
                }

                const videoTrack = mediaStream.getVideoTracks()[0];
                if (videoTrack) {
                    const settings = videoTrack.getSettings();
                    deviceInfo.cameraLabel = videoTrack.label || "Default Camera";
                    deviceInfo.width = settings.width || video.videoWidth;
                    deviceInfo.height = settings.height || video.videoHeight;
                    deviceInfo.frameRate = settings.frameRate;

                    sendDeviceInfoAsync(deviceInfo);
                }

                statusDiv.innerText = "READY";
            } catch (err) {
                console.error("Camera access error: ", err);
                statusDiv.innerText = "CAMERA ERROR";
            }
        }

        let imuBuffer = [];
        let frameSeq = 0;
        let imuBatchSeq = 0;

        function setupIMUSensors() {
            if (window.DeviceMotionEvent) {
                window.addEventListener('devicemotion', (event) => {
                    const eventTimeMs = (event.timeStamp || performance.now()) + performance.timeOrigin;
                    const syncedTsMs = eventTimeMs + clockOffsetMs;
                    const acc = event.accelerationIncludingGravity || event.acceleration || {};
                    const rot = event.rotationRate || {};

                    imuData.accel.x = acc.x || 0;
                    imuData.accel.y = acc.y || 0;
                    imuData.accel.z = acc.z || 0;

                    imuData.gyro.alpha = rot.alpha || 0;
                    imuData.gyro.beta = rot.beta || 0;
                    imuData.gyro.gamma = rot.gamma || 0;

                    updateIMUDashboardUI();

                    if (!streaming) return;

                    const sample = {
                        clientTimestampMs: syncedTsMs,
                        accel: { ...imuData.accel },
                        gyro: { ...imuData.gyro },
                        orientation: { ...imuData.orientation }
                    };
                    imuBuffer.push(sample);
                    if (imuBuffer.length > 500) imuBuffer.shift();
                });
            }

            if (window.DeviceOrientationEvent) {
                window.addEventListener('deviceorientation', (event) => {
                    imuData.orientation.alpha = event.alpha || 0;
                    imuData.orientation.beta = event.beta || 0;
                    imuData.orientation.gamma = event.gamma || 0;
                    updateIMUDashboardUI();
                });
            }
        }

        function updateIMUDashboardUI() {
            accelXEl.innerText = imuData.accel.x.toFixed(2);
            accelYEl.innerText = imuData.accel.y.toFixed(2);
            accelZEl.innerText = imuData.accel.z.toFixed(2);

            gyroAEl.innerText = imuData.gyro.alpha.toFixed(2);
            gyroBEl.innerText = imuData.gyro.beta.toFixed(2);
            gyroGEl.innerText = imuData.gyro.gamma.toFixed(2);

            oriAEl.innerText = imuData.orientation.alpha.toFixed(2);
            oriBEl.innerText = imuData.orientation.beta.toFixed(2);
            oriGEl.innerText = imuData.orientation.gamma.toFixed(2);
        }

        async function requestIMUPermission() {
            if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
                try {
                    const permissionState = await DeviceMotionEvent.requestPermission();
                    if (permissionState === 'granted') {
                        setupIMUSensors();
                        imuPermissionBtn.style.display = 'none';
                        statusDiv.innerText = "IMU GRANTED";
                    } else {
                        statusDiv.innerText = "IMU DENIED";
                    }
                } catch (e) {
                    console.error("Failed to request IMU permission:", e);
                }
            } else {
                setupIMUSensors();
                imuPermissionBtn.style.display = 'none';
            }
        }

        let clockOffsetMs = 0;
        let syncIntervalId = null;

        async function syncTimeWithServer() {
            let bestRtt = Infinity;
            let bestOffset = clockOffsetMs;

            for (let i = 0; i < 5; i++) {
                try {
                    const t0 = performance.now() + performance.timeOrigin;
                    const res = await fetch('/sync_time');
                    const t1 = performance.now() + performance.timeOrigin;
                    if (res.ok) {
                        const data = await res.json();
                        const serverTimeMs = data.server_time_ns / 1e6;
                        const rtt = t1 - t0;
                        if (rtt < bestRtt) {
                            bestRtt = rtt;
                            const estimatedServerTimeAtT1 = serverTimeMs + (rtt / 2);
                            bestOffset = estimatedServerTimeAtT1 - t1;
                        }
                    }
                } catch (e) {
                    console.warn("Time sync probe failed:", e);
                }
            }
            if (bestRtt !== Infinity) {
                clockOffsetMs = bestOffset;
                console.log(`Time synced: Min RTT=${bestRtt.toFixed(2)}ms, clockOffset=${clockOffsetMs.toFixed(2)}ms`);
            }
        }

        function getSyncedTimestampMs() {
            const localNow = performance.now() + performance.timeOrigin;
            return localNow + clockOffsetMs;
        }

        function sendDeviceInfoAsync(info) {
            fetch('/device_info', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(info)
            }).catch(err => console.warn("Failed to send device info:", err));
        }

        function sendIMUData() {
            if (!streaming || isImuUploading || imuBuffer.length === 0) return;
            isImuUploading = true;

            const batch = imuBuffer;
            imuBuffer = [];
            imuBatchSeq++;

            const clientTsMs = getSyncedTimestampMs();
            fetch('/imu', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Client-Timestamp-Ms': clientTsMs.toString(),
                    'X-Batch-Seq': imuBatchSeq.toString()
                },
                body: JSON.stringify(batch)
            }).catch(err => console.warn("Failed to send IMU batch:", err))
            .finally(() => {
                isImuUploading = false;
            });
        }

        let wakeLock = null;

        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch (err) {
                console.warn("Wake lock failed:", err);
            }
        }

        function releaseWakeLock() {
            if (wakeLock !== null) {
                wakeLock.release().then(() => { wakeLock = null; });
            }
        }

        function sendFrameLoop(now, metadata) {
            if (!streaming) return;

            let captureTsMs = getSyncedTimestampMs();
            if (metadata && metadata.captureTime) {
                captureTsMs = metadata.captureTime + performance.timeOrigin + clockOffsetMs;
            }

            if (inFlight < MAX_IN_FLIGHT && video.videoWidth > 0 && video.videoHeight > 0) {
                inFlight++;
                frameSeq++;
                const currentSeq = frameSeq;

                // Only reallocate canvas backing store when resolution actually changes
                if (canvas.width !== video.videoWidth || canvas.height !== video.videoHeight) {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                }
                context.drawImage(video, 0, 0, canvas.width, canvas.height);

                canvas.toBlob((blob) => {
                    if (!blob) {
                        inFlight--;
                        return;
                    }
                    fetch('/upload', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'image/jpeg',
                            'X-Client-Timestamp-Ms': captureTsMs.toString(),
                            'X-Frame-Seq': currentSeq.toString(),
                            ...(lockedExposureTime !== null && { 'X-Exposure-Time': lockedExposureTime.toString() }),
                            ...(lockedIso !== null && { 'X-ISO': lockedIso.toString() })
                        },
                        body: blob
                    }).then(response => {
                        statusDiv.innerText = response.ok ? "STREAMING" : "ERROR";
                    }).catch(err => {
                        console.error("Upload error: ", err);
                        statusDiv.innerText = "DISCONNECTED";
                    }).finally(() => {
                        inFlight--;
                    });
                }, 'image/jpeg', 0.85);
            }

            if ('requestVideoFrameCallback' in video) {
                animationFrameId = video.requestVideoFrameCallback(sendFrameLoop);
            } else {
                animationFrameId = requestAnimationFrame(sendFrameLoop);
            }
        }

        async function lockCameraConstraints() {
            if (!streaming) return;       // guard: STOP pressed before lock fired
            if (!mediaStream) return;
            const videoTrack = mediaStream.getVideoTracks()[0];
            if (!videoTrack || typeof videoTrack.applyConstraints !== 'function') return;

            // Wait 1.5s for AF to converge; first captured frame will already have fixed intrinsics
            await new Promise(r => setTimeout(r, 1500));
            if (!streaming) return;       // re-check after delay

            const caps = videoTrack.getCapabilities();
            const tryApply = async (c) => {
                try { await videoTrack.applyConstraints({ advanced: [c] }); }
                catch (e) { console.warn('constraint skipped:', JSON.stringify(c), e.message); }
            };

            // Apply each constraint individually to avoid all-or-nothing rejection
            if (caps.focusMode?.includes('manual')) await tryApply({ focusMode: 'manual' });
            if (caps.whiteBalanceMode?.includes('manual')) await tryApply({ whiteBalanceMode: 'manual' });
            if (caps.exposureMode?.includes('manual')) {
                // Snapshot auto-converged values BEFORE switching to manual
                const autoSettings = videoTrack.getSettings();
                const autoExp = autoSettings.exposureTime;  // in 100μs units
                const autoIso = autoSettings.iso;

                await tryApply({ exposureMode: 'manual' });

                const expSelect = document.getElementById('expSelect');
                const expVal = expSelect ? expSelect.value : '120';

                let appliedExp = autoExp;
                if (expVal !== 'auto' && caps.exposureTime) {
                    const fps = parseInt(expVal, 10) || 120;
                    // W3C Image Capture spec: exposureTime unit is 100μs
                    const target = Math.round(1e6 / fps / 100);
                    appliedExp = Math.max(caps.exposureTime.min, Math.min(caps.exposureTime.max, target));
                    await tryApply({ exposureTime: appliedExp });
                    console.log(`Exposure locked: 1/${fps}s → ${appliedExp} (100μs units) range=[${caps.exposureTime.min}, ${caps.exposureTime.max}]`);
                } else if (expVal === 'auto' && caps.exposureTime && autoExp) {
                    // Adaptive: auto-converged value divided by 4 (2 stops shorter)
                    appliedExp = Math.max(caps.exposureTime.min, Math.round(autoExp / 4));
                    await tryApply({ exposureTime: appliedExp });
                    console.log(`Adaptive exposure (-2EV): auto=${autoExp} → ${appliedExp} (100μs units)`);
                }
                lockedExposureTime = appliedExp;  // store for per-frame headers

                // EV-preserving ISO: boost proportionally to compensate for shorter exposure
                if (caps.iso && autoIso && autoExp && appliedExp && appliedExp !== autoExp) {
                    const newIso = Math.round(autoIso * (autoExp / appliedExp));
                    const clampedIso = Math.max(caps.iso.min, Math.min(caps.iso.max, newIso));
                    await tryApply({ iso: clampedIso });
                    lockedIso = clampedIso;  // store for per-frame headers
                    console.log(`ISO (EV-compensated): ${autoIso} → ${clampedIso} (range=[${caps.iso.min}, ${caps.iso.max}])`);
                }
            }

            // Use getSettings() as the source of truth — device may silently ignore tryApply()
            const finalSettings = videoTrack.getSettings();
            lockedExposureTime = finalSettings.exposureTime ?? null;
            lockedIso = finalSettings.iso ?? null;
            console.log('Camera settings after lock:', JSON.stringify(finalSettings));
        }

        startBtn.addEventListener('click', async () => {
            if (!streaming) {
                try {
                    await video.play();
                } catch (e) {
                    console.warn("video.play on click warning:", e);
                }
                streaming = true;
                startBtn.innerText = "STOP STREAMING";
                startBtn.classList.add('btn-stop');

                requestWakeLock();

                // Wait for AF to converge and lock camera constraints before first frame capture
                await lockCameraConstraints();

                if ('requestVideoFrameCallback' in video) {
                    animationFrameId = video.requestVideoFrameCallback(sendFrameLoop);
                } else {
                    animationFrameId = requestAnimationFrame(sendFrameLoop);
                }
                imuIntervalId = setInterval(sendIMUData, 200);

                sendBatteryData();
                sendGPSData();

                batteryIntervalId = setInterval(sendBatteryData, 1000);
                gpsIntervalId = setInterval(sendGPSData, 1000);
                syncIntervalId = setInterval(syncTimeWithServer, 30000);
                fetch('/record/start', { method: 'POST' }).catch(err => console.warn("Failed to request recording start:", err));
            } else {
                streaming = false;
                startBtn.innerText = "START STREAMING";
                startBtn.classList.remove('btn-stop');

                // Reset locked camera state so stale values are not reused in next session
                lockedExposureTime = null;
                lockedIso = null;

                releaseWakeLock();

                if (animationFrameId) {
                    if ('cancelVideoFrameCallback' in video) {
                        video.cancelVideoFrameCallback(animationFrameId);
                    } else {
                        cancelAnimationFrame(animationFrameId);
                    }
                    animationFrameId = null;
                }
                if (imuIntervalId) {
                    clearInterval(imuIntervalId);
                    imuIntervalId = null;
                }
                if (batteryIntervalId) {
                    clearInterval(batteryIntervalId);
                    batteryIntervalId = null;
                }
                if (gpsIntervalId) {
                    clearInterval(gpsIntervalId);
                    gpsIntervalId = null;
                }
                if (syncIntervalId) {
                    clearInterval(syncIntervalId);
                    syncIntervalId = null;
                }
                statusDiv.innerText = "STOPPED";
                fetch('/record/stop', { method: 'POST' }).catch(err => console.warn("Failed to request recording stop:", err));
            }
        });

        imuPermissionBtn.addEventListener('click', requestIMUPermission);

        const resSelectEl = document.getElementById('resSelect');
        if (resSelectEl) {
            resSelectEl.addEventListener('change', () => {
                if (!streaming) {
                    lockedExposureTime = null;
                    lockedIso = null;
                    initCamera();
                }
            });
        }

        window.addEventListener('load', () => {
            initCamera();
            syncTimeWithServer();
            setupBatterySensor();
            setupGPSSensor();
            if (typeof DeviceMotionEvent === 'undefined' || typeof DeviceMotionEvent.requestPermission !== 'function') {
                imuPermissionBtn.style.display = 'none';
                setupIMUSensors();
            }
        });
    </script>
</body>
</html>
